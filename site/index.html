<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Selenium Lab 9 Demo Shop</title><style>body{font:16px Arial;background:#eef2f8;margin:0;color:#20314b}main{max-width:850px;margin:35px auto}section{background:white;padding:25px;margin:15px;border-radius:12px}input,button{padding:11px;margin:5px;border-radius:6px}button{background:#175ac1;color:white;border:0;cursor:pointer}.hide{display:none}.item{padding:12px;border-bottom:1px solid #ddd}#login-error{color:#b00}</style></head><body><main><h1>Demo Shop - Selenium Lab 9</h1><section id="login-area"><h2>Đăng nhập</h2><p>Demo: student / 123456</p><input id="username" placeholder="Tên đăng nhập"><input id="password" type="password" placeholder="Mật khẩu"><button id="login-btn">Đăng nhập</button><p id="login-error"></p></section><section id="shop-area" class="hide"><h2>Xin chào <span id="greeting"></span></h2><button id="logout-btn">Đăng xuất</button><h3>Sản phẩm</h3><input id="search" placeholder="Tìm sản phẩm"><button id="search-btn">Tìm kiếm</button><div id="products"></div><h3>Giỏ hàng (<span id="cart-count">0</span>)</h3><div id="cart-items"></div><button id="clear-cart">Xóa giỏ hàng</button></section></main><script>
const catalog=[{id:1,name:'Laptop',price:1500},{id:2,name:'Mouse',price:25},{id:3,name:'Keyboard',price:70}],$=id=>document.getElementById(id);let cart=[];
function renderProducts(q=''){const result=catalog.filter(x=>x.name.toLowerCase().includes(q.trim().toLowerCase()));$('products').innerHTML=result.length?result.map(x=>`<div class="item" data-product="${x.id}">${x.name} — $${x.price} <button data-add="${x.id}">Thêm vào giỏ</button></div>`).join(''):'<p id="no-results">Không tìm thấy sản phẩm</p>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{cart.push(catalog.find(x=>x.id===Number(b.dataset.add)));renderCart()})}
function renderCart(){$('cart-count').textContent=cart.length;$('cart-items').innerHTML=cart.length?cart.map(x=>`<p>${x.name}</p>`).join(''):'<p id="empty-cart">Giỏ hàng trống</p>'}
$('login-btn').onclick=()=>{if($('username').value==='student'&&$('password').value==='123456'){$('login-error').textContent='';$('greeting').textContent='student';$('login-area').classList.add('hide');$('shop-area').classList.remove('hide');cart=[];renderProducts();renderCart()}else{$('login-error').textContent='Sai tài khoản hoặc mật khẩu'}};
$('logout-btn').onclick=()=>{$('shop-area').classList.add('hide');$('login-area').classList.remove('hide');$('username').value='';$('password').value='';cart=[]};
$('search-btn').onclick=()=>renderProducts($('search').value);$('clear-cart').onclick=()=>{cart=[];renderCart()};
</script></body></html>
